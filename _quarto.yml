# bibliography: bib/bib.bib
bibliography: specifics/bib-local.bib
csl: specifics/apa7.csl



  
editor: source
keep-md: false
#prefer-html: true

execute:
  freeze: auto
  echo: true
  warning: false
  message: false
  cache: true
  # message: false

knitr:
  opts_knit:
    verbose: true
    fig-align: center
  opts_chunk: 
    collapse: true
    out.width: "100%"
    fig.align: center
    results: hold
    rows.print: 5
    #dev: cairo_pdf
    # comment: "#>" 
    R.options:
      knitr. graphics.auto_pdf: true  # use pdf version of image for pdf output formats


format:

  html:
    toc: true
    lang: de
    theme:
      light: lumen
      dark: darkly
    #css: specifics/styles.css
    number-sections: true
    df-print: paged
    code-fold: false

    fig-align: center
    fig-asp: 0.7

    code-link: true
    code-annotations: true
    mermaid:
      theme: default
    out-width: 75%
    dev: png
    fig-format: png
    css: specifics/webex.css  # r-exams
    include-after-body: specifics/webex.js  # r-exams
    lightbox: true

